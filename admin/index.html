<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Write a blog post</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --panel: #ffffff;
      --panel-2: #edf0ff;
      --border: #dfe7f3;
      --text: #1c2434;
      --muted: #5b6880;
      --accent: #3d5afe;
      --accent-2: #2e3a8c;
      --shadow: 0 18px 45px rgba(16, 24, 40, 0.08);
      --success: #1a7f5a;
      --error: #b42318;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      background: linear-gradient(180deg, #eef3ff 0%, var(--bg) 100%);
      color: var(--text);
    }
    .shell {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 20px 80px;
    }
    .topbar {
      display: flex; justify-content: space-between; align-items: center;
      gap: 12px; margin-bottom: 28px;
    }
    .brand {
      font-weight: 800; letter-spacing: -.04em;
      font-size: 1.2rem; text-decoration: none; color: var(--text);
    }
    .nav-actions { display: flex; gap: 12px; align-items: center; }
    .chip, .primary, .ghost {
      border-radius: 999px; border: 1px solid var(--border);
      padding: 10px 16px; font-size: 0.9rem; font-weight: 700;
      text-decoration: none; cursor: pointer;
    }
    .chip { background: rgba(255,255,255,0.7); color: var(--text); }
    .primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff; border-color: transparent; box-shadow: var(--shadow);
    }
    .ghost { background: #fff; color: var(--text); }
    .auth-card {
      background: var(--panel);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      border-radius: 24px;
      padding: 28px;
      max-width: 520px; margin: 36px auto 0; text-align: center;
    }
    .auth-card h1 {
      margin: 0 0 10px; font-size: clamp(2rem, 4vw, 2.8rem);
      letter-spacing: -.05em;
    }
    .auth-card p {
      margin: 0 0 24px; color: var(--muted); line-height: 1.6;
    }
    .hidden { display: none !important; }
    .editor-wrap {
      display: grid; grid-template-columns: 1.25fr 0.75fr; gap: 24px;
    }
    .panel {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 24px; box-shadow: var(--shadow); overflow: hidden;
    }
    .panel-header {
      display: flex; justify-content: space-between; align-items: center;
      gap: 12px; padding: 20px 22px; border-bottom: 1px solid var(--border);
      background: rgba(237, 240, 255, 0.7);
    }
    .panel-header h2 { margin: 0; font-size: 1.1rem; }
    .field {
      display: flex; flex-direction: column; gap: 8px; padding: 18px 22px;
    }
    label { font-weight: 700; font-size: 0.78rem; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
    input[type="text"], textarea, select {
      width: 100%; border: 1px solid var(--border); border-radius: 14px;
      padding: 12px 14px; font: inherit; color: var(--text); background: #fff;
    }
    textarea {
      min-height: 220px; resize: vertical;
      line-height: 1.65;
    }
    .tags { display: flex; flex-wrap: wrap; gap: 8px; }
    .tag { border: 1px solid var(--border); border-radius: 999px; background: #fff; color: var(--text); padding: 8px 12px; font-size: 0.82rem; }
    .tag.selected { background: rgba(61,90,254,0.08); border-color: rgba(61,90,254,0.35); color: var(--accent-2); }
    .meta-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .preview {
      padding: 18px 20px 28px;
    }
    .preview h1 {
      margin: 0 0 14px; font-size: clamp(2rem, 3vw, 3rem); letter-spacing: -.06em;
      line-height: 1.04;
    }
    .preview .meta {
      color: var(--muted); font-size: 0.82rem; margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap;
    }
    .preview .cover {
      width: 100%; border-radius: 18px; min-height: 180px; background: linear-gradient(135deg, #e0e7ff, #f3f4f6); border: 1px solid var(--border); margin-bottom: 18px;
      display: grid; place-items: center; color: var(--muted); font-weight: 700; overflow: hidden;
    }
    .preview .cover img { display: block; width: 100%; height: 180px; object-fit: cover; }
    .preview article {
      font-size: 1.02rem; line-height: 1.8; color: #232f3f;
    }
    .preview article h2, .preview article h3 { line-height: 1.2; margin-top: 24px; }
    .preview article code {
      background: rgba(61,90,254,0.08); color: var(--accent-2); padding: 2px 6px; border-radius: 6px;
      font-family: "SFMono-Regular", Consolas, monospace;
    }
    .preview article pre {
      background: #0f172a; color: #dfe8ff; padding: 16px 18px; border-radius: 14px; overflow: auto;
    }
    .preview article blockquote {
      margin: 24px 0; border-left: 4px solid var(--accent); padding-left: 14px; color: var(--muted);
      font-style: italic;
    }
    .preview article a { color: var(--accent); }
    .actions {
      display: flex; justify-content: flex-end; align-items: center; gap: 12px; padding: 20px 22px 24px;
    }
    .status {
      min-height: 22px; margin-top: 8px; font-size: 0.9rem; color: var(--muted);
    }
    .status.error { color: var(--error); }
    .status.success { color: var(--success); }
    @media (max-width: 900px) {
      .editor-wrap { grid-template-columns: 1fr; }
      .topbar { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <a class="brand" href="../index.html">SCM</a>
      <div class="nav-actions">
        <a class="chip" href="../blog.html">Blog</a>
        <button id="logoutBtn" class="ghost hidden" type="button">Log out</button>
      </div>
    </div>

    <section id="authView" class="auth-card">
      <h1>Write a post</h1>
      <p>Publishing is secured to your GitHub account only. Sign in with your GitHub identity to create a new article.</p>
      <button id="loginBtn" class="primary" type="button">Sign in with GitHub</button>
    </section>

    <section id="editorView" class="editor-wrap hidden">
      <div class="panel">
        <div class="panel-header">
          <h2>New article</h2>
          <span id="userLabel" class="chip">signed in</span>
        </div>

        <div class="field">
          <label for="titleInput">Title</label>
          <input id="titleInput" type="text" placeholder="Why this matters" />
        </div>

        <div class="meta-row">
          <div class="field">
            <label for="slugInput">Slug</label>
            <input id="slugInput" type="text" placeholder="why-this-matters" />
          </div>
          <div class="field">
            <label for="dateInput">Published date</label>
            <input id="dateInput" type="text" placeholder="2026-09-23" />
          </div>
        </div>

        <div class="field">
          <label for="excerptInput">Short summary</label>
          <textarea id="excerptInput" placeholder="A brief description readers will see on the homepage..."></textarea>
        </div>

        <div class="field">
          <label>Topic</label>
          <div id="tagContainer" class="tags">
            <button class="tag selected" type="button" data-tag="engineering">Engineering</button>
            <button class="tag" type="button" data-tag="identity">Identity</button>
            <button class="tag" type="button" data-tag="career">Career</button>
            <button class="tag" type="button" data-tag="product">Product</button>
          </div>
        </div>

        <div class="field">
          <label for="coverInput">Cover image URL</label>
          <input id="coverInput" type="text" placeholder="https://images.example.com/cover.jpg" />
        </div>

        <div class="field">
          <label for="markdownInput">Content</label>
          <textarea id="markdownInput" placeholder="# My article

Write your post here in Markdown.

- bullet
- list

```js
console.log('hello world');
```"></textarea>
        </div>

        <div class="actions">
          <button id="previewBtn" class="ghost" type="button">Refresh preview</button>
          <button id="publishBtn" class="primary" type="button">Publish post</button>
        </div>
        <div class="field">
          <div id="status" class="status" aria-live="polite"></div>
        </div>
      </div>

      <aside class="panel">
        <div class="panel-header">
          <h2>Live preview</h2>
        </div>
        <div class="preview">
          <h1 id="previewTitle">Your title goes here</h1>
          <div class="meta">
            <span id="previewDate">2026-09-23</span>
            <span>•</span>
            <span id="previewTag">Engineering</span>
          </div>
          <div class="cover" id="previewCover">Cover image</div>
          <article id="previewContent">
            Add some content to preview your article.
          </article>
        </div>
      </aside>
    </section>
  </div>

  <script>
    const workerBase = 'https://scmishra-blog-admin.scmishra-cse.workers.dev';
    const authView = document.getElementById('authView');
    const editorView = document.getElementById('editorView');
    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const publishBtn = document.getElementById('publishBtn');
    const previewBtn = document.getElementById('previewBtn');
    const statusBox = document.getElementById('status');

    const titleInput = document.getElementById('titleInput');
    const slugInput = document.getElementById('slugInput');
    const dateInput = document.getElementById('dateInput');
    const excerptInput = document.getElementById('excerptInput');
    const coverInput = document.getElementById('coverInput');
    const markdownInput = document.getElementById('markdownInput');
    const previewTitle = document.getElementById('previewTitle');
    const previewDate = document.getElementById('previewDate');
    const previewTag = document.getElementById('previewTag');
    const previewContent = document.getElementById('previewContent');
    const previewCover = document.getElementById('previewCover');
    const userLabel = document.getElementById('userLabel');

    let selectedTag = 'engineering';

    function setStatus(message, type = '') {
      statusBox.textContent = message;
      statusBox.className = 'status';
      if (type) statusBox.classList.add(type);
    }

    function renderPreview() {
      const title = titleInput.value.trim() || 'Your title goes here';
      const date = dateInput.value.trim() || new Date().toISOString().slice(0, 10);
      const tag = selectedTag || 'engineering';
      const markdown = markdownInput.value.trim();
      previewTitle.textContent = title;
      previewDate.textContent = date;
      previewTag.textContent = tag;
      const html = markdown ? markdownToHtml(markdown) : '<p>Add some content to preview your article.</p>';
      previewContent.innerHTML = html;

      const cover = coverInput.value.trim();
      if (cover) {
        previewCover.innerHTML = `<img src="${cover}" alt="Cover" />`;
      } else {
        previewCover.textContent = 'Cover image';
      }
    }

    function markdownToHtml(md) {
      const escaped = md
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
      const blocks = escaped.split(/\n\n+/);
      const html = blocks.map((block) => {
        const trimmed = block.trim();
        if (!trimmed) return '';
        if (/^#{1,6} /.test(trimmed)) {
          const level = trimmed.match(/^#+/)[0].length;
          const text = trimmed.replace(/^#{1,6} /, '');
          return `<h${level}>${text}</h${level}>`;
        }
        if (/^[-*] /.test(trimmed)) {
          const items = trimmed.split(/\n/).map((i) => i.replace(/^[-*] /, '')).map((i) => `<li>${i}</li>`).join('');
          return `<ul>${items}</ul>`;
        }
        if (/^> /.test(trimmed)) {
          const quote = trimmed.replace(/^> /gm, '');
          return `<blockquote>${quote}</blockquote>`;
        }
        if (/^```/.test(trimmed)) {
          const code = trimmed.replace(/^```[a-zA-Z]*\n/, '').replace(/\n```$/, '');
          return `<pre><code>${code}</code></pre>`;
        }
        return `<p>${trimmed.replace(/\n/g, '<br>')}</p>`;
      }).join('');
      return html;
    }

    function setLoggedIn(user) {
      authView.classList.add('hidden');
      editorView.classList.remove('hidden');
      userLabel.textContent = `Signed in as ${user.login}`;
      logoutBtn.classList.remove('hidden');
      renderPreview();
    }

    function setLoggedOut() {
      authView.classList.remove('hidden');
      editorView.classList.add('hidden');
      logoutBtn.classList.add('hidden');
      userLabel.textContent = 'signed in';
    }

    async function fetchSession() {
      try {
        const res = await fetch(`${workerBase}/api/session`, { credentials: 'include' });
        if (!res.ok) {
          setLoggedOut();
          return;
        }
        const user = await res.json();
        setLoggedIn(user);
      } catch (error) {
        setLoggedOut();
      }
    }

    async function publishPost() {
      const title = titleInput.value.trim();
      const slug = (slugInput.value.trim() || title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '')).trim();
      const date = dateInput.value.trim() || new Date().toISOString().slice(0, 10);
      const excerpt = excerptInput.value.trim();
      const cover = coverInput.value.trim();
      const markdown = markdownInput.value.trim();

      if (!title || !markdown) {
        setStatus('Title and content are required before publishing.', 'error');
        return;
      }

      try {
        setStatus('Publishing…');
        const res = await fetch(`${workerBase}/api/posts`, {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, slug, date, excerpt, cover, markdown, tag: selectedTag })
        });

        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          throw new Error(data.error || 'Could not publish post.');
        }

        setStatus(`Published: ${data.url || slug}.html`, 'success');
      } catch (error) {
        setStatus(error.message || 'Unable to publish. Please try again.', 'error');
      }
    }

    loginBtn.addEventListener('click', () => {
      window.location.href = `${workerBase}/auth/github`;
    });

    logoutBtn.addEventListener('click', async () => {
      await fetch(`${workerBase}/api/logout`, { method: 'POST', credentials: 'include' });
      setLoggedOut();
    });

    previewBtn.addEventListener('click', renderPreview);
    publishBtn.addEventListener('click', publishPost);

    document.querySelectorAll('.tag').forEach((button) => {
      button.addEventListener('click', () => {
        document.querySelectorAll('.tag').forEach((tag) => tag.classList.remove('selected'));
        button.classList.add('selected');
        selectedTag = button.dataset.tag;
        renderPreview();
      });
    });

    [titleInput, slugInput, excerptInput, coverInput, markdownInput, dateInput].forEach((el) => {
      el.addEventListener('input', renderPreview);
    });

    dateInput.value = new Date().toISOString().slice(0, 10);
    slugInput.value = 'welcome-to-my-blog';
    renderPreview();
    fetchSession();
  </script>
</body>
</html>
