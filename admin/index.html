<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blog Admin</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#1c2434;--muted:#5b6880;--line:#dfe7f3;--accent:#3d5afe;--dark:#2e3a8c;--danger:#b42318;--ok:#1a7f5a;--shadow:0 18px 45px #10182814}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#eef3ff,var(--bg));color:var(--ink);font:16px Inter,"Segoe UI",Arial,sans-serif}.shell{max-width:1280px;margin:auto;padding:28px 20px 70px}.topbar,.toolbar,.form-actions,.post-row{display:flex;align-items:center;gap:10px}.topbar{justify-content:space-between;margin-bottom:24px}.brand{color:var(--ink);font-weight:800;font-size:1.2rem;text-decoration:none}.actions{display:flex;gap:10px;flex-wrap:wrap}.button{border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);padding:9px 13px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none}.button.primary{background:linear-gradient(135deg,var(--accent),var(--dark));border:0;color:#fff}.button.danger{color:var(--danger)}.button:disabled{opacity:.55;cursor:wait}.hidden{display:none!important}.card,.auth-card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}.auth-card{max-width:560px;margin:52px auto;padding:34px;text-align:center}.auth-card h1{margin:0 0 10px;font-size:2.6rem;letter-spacing:-.05em}.muted{color:var(--muted)}.dashboard{display:grid;grid-template-columns:minmax(280px,.75fr) minmax(0,1.25fr);gap:22px}.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:19px 22px;border-bottom:1px solid var(--line);background:#edf0ffb3}.card-head h2{margin:0;font-size:1.08rem}.post-list{padding:12px}.post-row{justify-content:space-between;padding:15px 10px;border-bottom:1px solid var(--line)}.post-row:last-child{border-bottom:0}.post-row h3{margin:0 0 5px;font-size:1rem}.post-row small{color:var(--muted);font-size:.8rem}.post-actions{display:flex;gap:7px;flex-shrink:0}.form{padding:0 22px 22px}.field{display:flex;flex-direction:column;gap:7px;margin-top:16px}label{color:var(--muted);font-size:.76rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;color:var(--ink);font:inherit}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.toolbar{flex-wrap:wrap;padding:12px 0 0}.toolbar .button{padding:7px 10px;font-size:.87rem}.toolbar select{width:auto;padding:7px 9px}.editor-wrap{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:10px;background:#fff}.editor{min-height:330px;padding:17px;outline:0;line-height:1.75;font-size:1.02rem;overflow:auto}.editor:focus{box-shadow:inset 0 0 0 2px #3d5afe33}.editor img,.editor video,.editor iframe{display:block;max-width:100%;margin:16px 0;border-radius:12px}.editor blockquote{border-left:4px solid var(--accent);padding-left:15px;color:var(--muted);font-style:italic}.editor pre{background:#0f172a;color:#e5ecff;padding:14px;border-radius:10px;overflow:auto}.editor a{color:var(--accent)}.editor table{border-collapse:collapse;width:100%}.editor td,.editor th{border:1px solid var(--line);padding:8px}.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:12px 22px 0}.tab{border:0;border-bottom:3px solid transparent;background:transparent;padding:10px 14px;color:var(--muted);font-weight:800;cursor:pointer}.tab.active{border-color:var(--accent);color:var(--accent)}.preview{min-height:330px;padding:22px;line-height:1.75;overflow:auto}.preview h1{font-size:clamp(2rem,4vw,3.5rem);line-height:1.05}.preview img,.preview video,.preview iframe{max-width:100%;display:block;margin:16px 0;border-radius:12px}.status{min-height:24px;margin-top:14px;color:var(--muted)}.status.error{color:var(--danger)}.status.success{color:var(--ok)}.empty{text-align:center;color:var(--muted);padding:28px 12px}@media(max-width:900px){.dashboard{grid-template-columns:1fr}}@media(max-width:560px){.grid{grid-template-columns:1fr}.post-row{align-items:flex-start;flex-direction:column}.post-actions{width:100%}.post-actions .button{flex:1}}
</style>
</head>
<body><div class="shell">
<header class="topbar"><a class="brand" href="../index.html">SCM</a><div class="actions"><a class="button" href="../blog.html">View blog</a><button id="logout" class="button hidden">Log out</button></div></header>
<section id="auth" class="auth-card"><h1>Blog admin</h1><p class="muted">Write, preview, publish, edit, and delete rich posts.</p><button id="login" class="button primary">Sign in with GitHub</button></section>
<main id="dashboard" class="dashboard hidden"><section class="card"><div class="card-head"><h2>Published posts</h2><button id="newPost" class="button primary">New post</button></div><div id="postList" class="post-list"><p class="empty">Loading…</p></div></section>
<section class="card"><div class="card-head"><h2 id="formTitle">New post</h2><button id="cancel" class="button hidden">Cancel edit</button></div><div class="tabs"><button class="tab active" data-tab="write">Write</button><button class="tab" data-tab="preview">Preview</button></div><form id="form" class="form"><div class="field"><label for="title">Title</label><input id="title" required placeholder="Why this matters"></div><div class="grid"><div class="field"><label for="slug">Slug</label><input id="slug" placeholder="why-this-matters"></div><div class="field"><label for="date">Date</label><input id="date" type="date" required></div></div><div class="grid"><div class="field"><label for="category">Category</label><select id="category"><option>Engineering</option><option>Identity</option><option>Career</option><option>Product</option></select></div><div class="field"><label for="cover">Cover image URL</label><input id="cover" type="url" placeholder="https://…"></div></div><div class="field"><label for="excerpt">Short summary</label><textarea id="excerpt" rows="3"></textarea></div><div id="writePane"><div class="toolbar" aria-label="Formatting toolbar"><select id="fontSize" title="Font size"><option value="">Size</option><option value="1">Small</option><option value="3">Normal</option><option value="5">Large</option><option value="7">Huge</option></select><button type="button" class="button" data-cmd="bold"><b>B</b></button><button type="button" class="button" data-cmd="italic"><i>I</i></button><button type="button" class="button" data-cmd="underline"><u>U</u></button><button type="button" class="button" data-cmd="strikeThrough"><s>S</s></button><button type="button" class="button" data-cmd="formatBlock" data-value="h2">H2</button><button type="button" class="button" data-cmd="formatBlock" data-value="h3">H3</button><button type="button" class="button" data-cmd="insertUnorderedList">• List</button><button type="button" class="button" data-cmd="insertOrderedList">1. List</button><button type="button" class="button" data-cmd="formatBlock" data-value="blockquote">Quote</button><button type="button" class="button" data-cmd="formatBlock" data-value="pre">Code</button><button type="button" class="button" data-cmd="justifyLeft">Left</button><button type="button" class="button" data-cmd="justifyCenter">Center</button><button type="button" class="button" data-cmd="justifyRight">Right</button><button type="button" class="button" id="link">Link</button><button type="button" class="button" id="image">Image</button><button type="button" class="button" id="video">Video</button><button type="button" class="button" id="upload">Upload</button><button type="button" class="button" data-cmd="removeFormat">Clear</button></div><input id="file" type="file" class="hidden" accept="image/*,video/*"><div id="editor" class="editor" contenteditable="true" spellcheck="true"><p>Start writing…</p></div></div><div id="previewPane" class="preview hidden"></div><div class="form-actions"><button id="clear" type="button" class="button">Clear</button><button id="save" class="button primary">Publish post</button></div><div id="status" class="status"></div></form></section></main></div>
<script>
const base='https://scmishra-blog-admin.scmishra-cse.workers.dev',q=s=>document.querySelector(s),auth=q('#auth'),dash=q('#dashboard'),list=q('#postList'),editor=q('#editor'),preview=q('#previewPane'),form=q('#form'),status=q('#status'),save=q('#save'),file=q('#file');let editing=null;const el={title:q('#title'),slug:q('#slug'),date:q('#date'),category:q('#category'),cover:q('#cover'),excerpt:q('#excerpt')};
const today=()=>new Date().toISOString().slice(0,10),esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),slugify=v=>String(v||'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
function say(v,t=''){status.textContent=v;status.className='status'+(t?' '+t:'')}async function api(path,opt={}){const r=await fetch(base+path,{credentials:'include',...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||`Request failed (${r.status})`);return d}
function reset(){editing=null;form.reset();el.date.value=today();el.category.value='Engineering';editor.innerHTML='<p>Start writing…</p>';q('#formTitle').textContent='New post';save.textContent='Publish post';q('#cancel').classList.add('hidden');say('');showTab('write')}
function showTab(tab){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));q('#writePane').classList.toggle('hidden',tab!=='write');preview.classList.toggle('hidden',tab!=='preview');if(tab==='preview'){preview.innerHTML=editor.innerHTML||'<p>Nothing to preview yet.</p>';}}
function command(c,v=null){editor.focus();document.execCommand(c,false,v)}function insert(html){editor.focus();document.execCommand('insertHTML',false,html)}
function media(kind){const u=prompt(kind==='image'?'Image URL:':'Video URL or YouTube URL:');if(!u)return;if(kind==='image')insert(`<img src="${esc(u)}" alt="Inserted image">`);else{const youtube=/youtu\.be|youtube\.com/.test(u),src=youtube?(u.includes('youtu.be')?u.replace('youtu.be/','www.youtube.com/embed/'):u.replace('watch?v=','embed/')):u;insert(youtube?`<iframe src="${esc(src)}" title="Video" allowfullscreen></iframe>`:`<video controls src="${esc(src)}"></video>`);}}
function uploadMedia(f){const r=new FileReader();r.onload=()=>insert(f.type.startsWith('image/')?`<img src="${r.result}" alt="Uploaded image">`:`<video controls src="${r.result}"></video>`);r.readAsDataURL(f)}
async function load(){try{const posts=await api('/api/posts');list.innerHTML=posts.length?posts.map(p=>`<article class="post-row"><div><h3>${esc(p.title)}</h3><small>${esc(p.date)} • ${esc(p.category)} • ${esc(p.slug)}</small></div><div class="post-actions"><button class="button edit" data-slug="${esc(p.slug)}">Edit</button><button class="button danger del" data-slug="${esc(p.slug)}" data-title="${esc(p.title)}">Delete</button></div></article>`).join(''):'<p class="empty">No published posts yet.</p>';document.querySelectorAll('.edit').forEach(b=>b.onclick=()=>fill(posts.find(p=>p.slug===b.dataset.slug)));document.querySelectorAll('.del').forEach(b=>b.onclick=()=>remove(b.dataset.slug,b.dataset.title))}catch(e){list.innerHTML=`<p class="empty">${esc(e.message)}</p>`}}
function fill(p){editing=p.slug;el.title.value=p.title||'';el.slug.value=p.slug||'';el.date.value=p.date||today();el.category.value=p.category||'Engineering';el.cover.value=p.cover||'';el.excerpt.value=p.excerpt||'';editor.innerHTML=p.contentHtml||'<p>Start writing…</p>';q('#formTitle').textContent='Edit post';save.textContent='Save changes';q('#cancel').classList.remove('hidden');showTab('write');say(`Editing “${p.title}”`);scrollTo({top:0,behavior:'smooth'})}
async function remove(s,t){if(!confirm(`Delete “${t}”?`))return;try{say('Deleting…');await api('/api/posts/'+encodeURIComponent(s),{method:'DELETE'});if(editing===s)reset();await load();say('Post deleted.','success')}catch(e){say(e.message,'error')}}
document.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=()=>command(b.dataset.cmd,b.dataset.value||null));q('#fontSize').onchange=e=>command('fontSize',e.target.value);q('#link').onclick=()=>{const u=prompt('Link URL:');if(u)command('createLink',u)};q('#image').onclick=()=>media('image');q('#video').onclick=()=>media('video');q('#upload').onclick=()=>file.click();file.onchange=e=>{if(e.target.files[0])uploadMedia(e.target.files[0]);file.value=''};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));el.title.oninput=()=>{if(!editing)el.slug.value=slugify(el.title.value)};q('#newPost').onclick=reset;q('#clear').onclick=reset;q('#cancel').onclick=reset;
form.onsubmit=async e=>{e.preventDefault();const title=el.title.value.trim(),slug=slugify(el.slug.value||title);if(!title||!editor.innerHTML.trim()){say('Title and content are required.','error');return}try{save.disabled=true;say(editing?'Saving changes…':'Publishing…');await api('/api/posts',{method:'POST',body:JSON.stringify({title,slug,date:el.date.value||today(),tag:el.category.value,cover:el.cover.value.trim(),excerpt:el.excerpt.value.trim(),contentHtml:editor.innerHTML,action:editing?'update':'create',originalSlug:editing||''})});await load();reset();say(editing?'Post updated.':'Post published.','success')}catch(e){say(e.message,'error')}finally{save.disabled=false}};
q('#login').onclick=()=>location.href=base+'/auth/github';q('#logout').onclick=async()=>{await fetch(base+'/api/logout',{method:'POST',credentials:'include'});location.reload()};(async()=>{try{await api('/api/session');auth.classList.add('hidden');dash.classList.remove('hidden');q('#logout').classList.remove('hidden');reset();await load()}catch{}})();
</script></body></html>
