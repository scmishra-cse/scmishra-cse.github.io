<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Blog Admin</title>
  <style>
    :root{--bg:#f4f7fb;--card:#fff;--ink:#1c2434;--muted:#5b6880;--line:#dfe7f3;--accent:#3d5afe;--dark:#2e3a8c;--danger:#b42318;--ok:#1a7f5a;--shadow:0 18px 45px rgba(16,24,40,.08)}
    *{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#eef3ff,var(--bg));color:var(--ink);font:16px Inter,"Segoe UI",Arial,sans-serif}.shell{max-width:1240px;margin:auto;padding:28px 20px 70px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}.brand{font-weight:800;font-size:1.2rem;text-decoration:none}.actions{display:flex;gap:10px;flex-wrap:wrap}.button{border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);padding:10px 16px;font:inherit;font-weight:700;cursor:pointer}.button.primary{background:linear-gradient(135deg,var(--accent),var(--dark));border:0;color:#fff}.button.danger{color:var(--danger);border-color:#f2c4bf}.button:disabled{opacity:.55;cursor:wait}.hidden{display:none!important}.auth-card,.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}.auth-card{max-width:560px;margin:50px auto;padding:34px;text-align:center}.auth-card h1{margin:0 0 10px;font-size:2.4rem;letter-spacing:-.05em}.muted{color:var(--muted)}.dashboard{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(280px,.85fr);gap:22px}.panel-header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:20px 22px;border-bottom:1px solid var(--line);background:#edf0ffb3}.panel-header h2{margin:0;font-size:1.1rem}.post-list{padding:12px}.post-row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 12px;border-bottom:1px solid var(--line)}.post-row:last-child{border-bottom:0}.post-row h3{margin:0 0 4px;font-size:1rem}.post-row small{color:var(--muted)}.post-actions{display:flex;gap:8px;flex-shrink:0}.form{padding:4px 22px 22px}.field{display:flex;flex-direction:column;gap:7px;margin-top:16px}label{font-size:.76rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:#fff;color:var(--ink);font:inherit}textarea{min-height:230px;resize:vertical;line-height:1.6}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.status{min-height:22px;margin-top:14px;color:var(--muted)}.status.error{color:var(--danger)}.status.success{color:var(--ok)}.empty{padding:28px;text-align:center;color:var(--muted)}@media(max-width:850px){.dashboard{grid-template-columns:1fr}}@media(max-width:560px){.grid{grid-template-columns:1fr}.post-row{align-items:flex-start;flex-direction:column}.post-actions{width:100%}.post-actions .button{flex:1}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar"><a class="brand" href="../index.html">SCM</a><div class="actions"><a class="button" href="../blog.html">View blog</a><button id="logoutBtn" class="button hidden" type="button">Log out</button></div></header>
    <section id="authView" class="auth-card"><h1>Blog admin</h1><p class="muted">Create, edit, and delete posts in your GitHub-backed blog.</p><button id="loginBtn" class="button primary" type="button">Sign in with GitHub</button></section>
    <main id="dashboard" class="dashboard hidden">
      <section class="panel"><div class="panel-header"><h2>Published posts</h2><button id="newBtn" class="button primary" type="button">New post</button></div><div id="postList" class="post-list"><p class="empty">Loading posts…</p></div></section>
      <section class="panel"><div class="panel-header"><h2 id="formTitle">New post</h2><button id="cancelBtn" class="button hidden" type="button">Cancel edit</button></div><form id="postForm" class="form"><div class="field"><label for="title">Title</label><input id="title" required></div><div class="grid"><div class="field"><label for="slug">Slug</label><input id="slug" required pattern="[a-z0-9-]+"></div><div class="field"><label for="date">Date</label><input id="date" type="date" required></div></div><div class="field"><label for="category">Category</label><select id="category"><option>Engineering</option><option>Identity</option><option>Career</option><option>Product</option></select></div><div class="field"><label for="excerpt">Excerpt</label><textarea id="excerpt" rows="3"></textarea></div><div class="field"><label for="cover">Cover image URL</label><input id="cover" type="url"></div><div class="field"><label for="markdown">Content</label><textarea id="markdown" required placeholder="# Your post\n\nWrite in Markdown…"></textarea></div><div class="form-actions"><button id="resetBtn" class="button" type="button">Clear</button><button id="saveBtn" class="button primary" type="submit">Publish post</button></div><div id="status" class="status" aria-live="polite"></div></form></section>
    </main>
  </div>
  <script>
    const workerBase='https://scmishra-blog-admin.scmishra-cse.workers.dev';
    const authView=document.getElementById('authView'),dashboard=document.getElementById('dashboard'),loginBtn=document.getElementById('loginBtn'),logoutBtn=document.getElementById('logoutBtn'),postList=document.getElementById('postList'),form=document.getElementById('postForm'),formTitle=document.getElementById('formTitle'),saveBtn=document.getElementById('saveBtn'),cancelBtn=document.getElementById('cancelBtn'),statusBox=document.getElementById('status');
    const fields={title:document.getElementById('title'),slug:document.getElementById('slug'),date:document.getElementById('date'),category:document.getElementById('category'),excerpt:document.getElementById('excerpt'),cover:document.getElementById('cover'),markdown:document.getElementById('markdown')};
    let editingSlug=null;
    const today=()=>new Date().toISOString().slice(0,10);
    const setStatus=(message,type='')=>{statusBox.textContent=message;statusBox.className='status'+(type?' '+type:'')};
    const escapeHtml=(value='')=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    async function api(path,options={}){const response=await fetch(workerBase+path,{credentials:'include',...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||`Request failed (${response.status})`);return data}
    function resetForm(){editingSlug=null;form.reset();fields.date.value=today();fields.category.value='Engineering';formTitle.textContent='New post';saveBtn.textContent='Publish post';cancelBtn.classList.add('hidden');setStatus('')}
    function fillForm(post){editingSlug=post.slug;fields.title.value=post.title||'';fields.slug.value=post.slug||'';fields.date.value=post.date||today();fields.category.value=post.category||'Engineering';fields.excerpt.value=post.excerpt||'';fields.cover.value=post.cover||'';fields.markdown.value=post.markdown||'';formTitle.textContent='Edit post';saveBtn.textContent='Save changes';cancelBtn.classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'});setStatus(`Editing “${post.title}”`)}
    async function loadPosts(){try{const posts=await api('/api/posts');if(!posts.length){postList.innerHTML='<p class="empty">No published posts yet.</p>';return}postList.innerHTML=posts.map(post=>`<article class="post-row"><div><h3>${escapeHtml(post.title)}</h3><small>${escapeHtml(post.date||'')} · ${escapeHtml(post.category||'Engineering')} · ${escapeHtml(post.slug)}</small></div><div class="post-actions"><button class="button edit-btn" data-slug="${escapeHtml(post.slug)}" type="button">Edit</button><button class="button danger delete-btn" data-slug="${escapeHtml(post.slug)}" data-title="${escapeHtml(post.title)}" type="button">Delete</button></div></article>`).join('');postList.querySelectorAll('.edit-btn').forEach(button=>button.addEventListener('click',()=>fillForm(posts.find(post=>post.slug===button.dataset.slug))));postList.querySelectorAll('.delete-btn').forEach(button=>button.addEventListener('click',()=>removePost(button.dataset.slug,button.dataset.title)))}catch(error){postList.innerHTML=`<p class="empty">${escapeHtml(error.message)}</p>`}}
    async function removePost(slug,title){if(!confirm(`Delete “${title}”? This permanently removes the post from GitHub.`))return;try{setStatus('Deleting…');await api('/api/posts/'+encodeURIComponent(slug),{method:'DELETE'});if(editingSlug===slug)resetForm();await loadPosts();setStatus('Post deleted.','success')}catch(error){setStatus(error.message,'error')}}
    async function checkSession(){try{const user=await api('/api/session');authView.classList.add('hidden');dashboard.classList.remove('hidden');logoutBtn.classList.remove('hidden');await loadPosts()}catch{authView.classList.remove('hidden');dashboard.classList.add('hidden');logoutBtn.classList.add('hidden')}}
    loginBtn.addEventListener('click',()=>{window.location.href=workerBase+'/auth/github'});
    logoutBtn.addEventListener('click',async()=>{await fetch(workerBase+'/api/logout',{method:'POST',credentials:'include'});location.reload()});
    document.getElementById('newBtn').addEventListener('click',resetForm);document.getElementById('resetBtn').addEventListener('click',resetForm);cancelBtn.addEventListener('click',resetForm);
    fields.title.addEventListener('input',()=>{if(!editingSlug&&!fields.slug.value)fields.slug.value=fields.title.value.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')});
    form.addEventListener('submit',async(event)=>{event.preventDefault();saveBtn.disabled=true;setStatus(editingSlug?'Saving changes…':'Publishing…');const body={title:fields.title.value.trim(),slug:fields.slug.value.trim(),date:fields.date.value,tag:fields.category.value,excerpt:fields.excerpt.value.trim(),cover:fields.cover.value.trim(),markdown:fields.markdown.value.trim(),action:editingSlug?'update':'create',originalSlug:editingSlug};try{await api('/api/posts',{method:'POST',body:JSON.stringify(body)});await loadPosts();setStatus(editingSlug?'Post updated.':'Post published.','success');resetForm()}catch(error){setStatus(error.message,'error')}finally{saveBtn.disabled=false}});
    resetForm();checkSession();
  </script>
</body>
</html>
